// The Ziggy Vite example's Android project: the app, which takes Ziggy's Android native app from the Ziggy checkout beside this
// repository.
rootProject.name = 'ziggy-example-vite-android'

include ':app'
includeBuild('../../../../../../ziggy/.claude/worktrees/splash-screens/packages/ziggy/native/android') {
    dependencySubstitution {
        substitute module('dev.ziggy:ziggy-native-android') using project(':')
    }
}
